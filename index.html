.ac{flex:none;width:auto;margin:0;padding:9px 10px;font-size:9px;background:#333c57;color:#f4f4f4;border:2px solid #0f1020;white-space:nowrap}.ac.on{background:#ffcd75;color:#1a1c2c;border-color:#ef7d57}
.astop{flex:none;width:auto;margin:0;padding:9px 8px;font-size:8px;line-height:1.3;background:#b13e53;color:#fff;border:2px solid #5a1a28}
.ax{flex:none;width:38px;margin:0;padding:9px 0;font-size:12px}
.atb{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:4px;padding:0 8px 6px;scrollbar-width:none}.atb button{flex:none;width:auto;margin:0;padding:8px 9px;font-size:8px;background:#222742;color:#b9c3e6;border:2px solid #0f1020}.atb button.on{background:#41a6f6;color:#10162a}
.agr{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-content:start;flex:1;min-height:0}
.at{width:auto;margin:0;padding:6px 2px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#1c2038;color:#f4f4f4;border:2px solid #333c57;font-size:8px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative}
.at .ai{font-size:22px;line-height:1;display:block}.at .ai img.px{width:24px;height:24px;display:block}.at .al{font:15px/1 VT323,monospace;text-transform:none;text-align:center;padding:0 2px;display:block}
.at.on{background:#a7f070;color:#10162a;border-color:#5b8f2e}.at.pin::after{content:"\2605";position:absolute;top:1px;right:3px;font:10px sans-serif;color:#ffcd75}.at.on.pin::after{color:#10162a}
.at.flash{outline:3px solid #fff}
.agr .axr{grid-column:1/-1;display:flex;gap:6px}.agr .axr select,.agr .axr input{flex:1;min-width:0;margin:0;font-size:18px;padding:8px;background:#0f1020;color:#f4f4f4;border:3px solid #333c57;border-radius:0}.agr .axr button{flex:1;width:auto;margin:0;padding:10px 6px;font-size:8px}
.agr .note{grid-column:1/-1;color:#8f9bbf;font:16px/1.15 VT323,monospace;margin:0;text-align:center;text-transform:none}
html.asopen main{padding-bottom:50vh}
@media(max-width:340px){.agr{gap:5px;padding:0 6px 12px}.at{min-height:60px}.ac{font-size:8px;padding:9px 8px}}
.ovl.lights{background:#000;pointer-events:none}.ovl.lights b{opacity:.2}
.ovl.call{background:rgba(10,12,30,.97)}.cbox{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(86vw,340px)}.cbox .cav{font-size:84px;line-height:1}.cbox .cav img.px{width:96px;height:96px}.cbox p{margin:0;color:#b9c3e6}.cbt{display:flex;gap:12px;width:100%;margin-top:18px}.cbt button{margin:0;font-size:11px}.cbt .cdn{background:#b13e53;color:#fff;border-color:#5a1a28}.cbt .cac{background:#a7f070;color:#10162a;border-color:#5b8f2e}
.ovl.ad{background:rgba(0,0,0,.94)}.abx{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(86vw,340px);border:4px solid #fff;padding:16px 12px;background:#1a1c2c;box-shadow:6px 6px 0 #0f1020}.abx .atp{align-self:flex-start;font-size:9px;background:#ffcd75;color:#1a1c2c;padding:3px 6px}.abx .abg{font-size:64px;line-height:1}.abx .abg img.px{width:72px;height:72px}.abx p{margin:0;font-size:11px;color:#b9c3e6}.abx .ask{margin:8px 0 0;font-size:10px;background:#333c57;color:#f4f4f4;width:auto;padding:12px 14px}
.ovl.cook{justify-content:flex-end;background:rgba(0,0,0,.3);padding-bottom:max(24px,env(safe-area-inset-bottom))}.cok{position:relative;width:min(92vw,380px);background:#f4f4f4;color:#1a1c2c;border:4px solid #1a1c2c;padding:16px 14px 10px;box-shadow:6px 6px 0 #0f1020}.cok b{font-size:13px}.cok p{margin:8px 0 12px;font-size:10px}.cok button{margin:0 0 6px}.cok .ckx{position:absolute;top:-18px;right:-8px;width:36px;height:36px;padding:0;background:#fff;color:#1a1c2c;font-size:12px;border:3px solid #1a1c2c;margin:0}
@keyframes aspin{to{transform:rotate(360deg)}}
textarea{width:100%;padding:12px;background:#0f1020;border:3px solid var(--line);border-radius:0;color:var(--ink);font:18px/1.2 VT323,monospace;margin-bottom:10px;-webkit-user-select:text;user-select:text;word-break:break-all;resize:none}

/* ===== B theme (final-41): purple pixel look on every page ===== */
:root{--line:#5a47c0;--mute:#b6a8f0;--bdk:#1a0e2e}
body{background:linear-gradient(#5b36d6 0%,#3b22a0 55%,#2a1a6e 100%) fixed}
h2{color:#fff;text-shadow:2px 2px 0 #ff3fa0,-2px 0px 0 #1a0e2e,2px 0px 0 #1a0e2e,0px -2px 0 #1a0e2e,0px 2px 0 #1a0e2e,-2px -2px 0 #1a0e2e,2px -2px 0 #1a0e2e,-2px 2px 0 #1a0e2e,2px 2px 0 #1a0e2e}
button{background:#ffb020;color:#1a0e2e;border-bottom:4px solid #c26f06;border-right:4px solid #c26f06;box-shadow:0 0 0 3px #1a0e2e,inset 3px 3px 0 rgba(255,255,255,.42)}
button.alt{background:#3b22a0;color:#fff;border-color:#26156f;box-shadow:0 0 0 3px #1a0e2e,inset 3px 3px 0 rgba(255,255,255,.2)}
button.link,button.ax,#afab{box-shadow:none}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
input:not([type=range]){background:#1b1150;border:3px solid #1a0e2e;box-shadow:inset 0 0 0 2px #4a2fc0;color:#fff}
input::placeholder{color:#8d7fd6;opacity:1}
.chip,.row,.clue{background:rgba(27,17,80,.72)}.chip.me,.row.me{background:#4a2fc0}
.pane,.arena,.cv,.tw{background:#1b1150}
.code{color:#ffe14d;text-shadow:3px 3px 0 #ff3fa0}
.c1{background:#ff5d73;border-color:#b0243c;color:#fff}.c2{background:#3b8bff;border-color:#1b4fb8;color:#fff}.c3{background:#4cc9f0;border-color:#1f8bb0;color:#10162a}.c4{background:#3ddc97;border-color:#1b9a62;color:#0b3a22}.c5{background:#f77f00;border-color:#a64b00;color:#fff}.c6{background:#ff7ab6;border-color:#b8316f;color:#fff}
.g.t,.g.t.c0{background:#3ddc97;border-color:#1b9a62;color:#fff}
.opts button{background:#3b22a0;color:#fff;border-color:#26156f}.opts button.good{background:#3ddc97;color:#0b3a22;border-color:#1b9a62}.opts button.bad{background:#ff5d73;color:#fff;border-color:#b0243c}
.seg button.on{background:#ff9f1c;color:#1a0e2e;border-color:#c4590a}
#menu{background:rgba(26,16,64,.985)}#menu .g2 button.alt{background:#3b22a0}
#mbtn{padding:9px 12px}
