    if(k>=sw){clearInterval(iv);ready=true;st.textContent='Where is the fox?';snd('go');return}
    var x=Math.floor(R()*c),y=(x+1+Math.floor(R()*(c-1)))%c,t=slot[x];slot[x]=slot[y];slot[y]=t;
    cups[x].style.left=slot[x]*W+'%';cups[y].style.left=slot[y]*W+'%';snd('fbswap');k++},step))},1200));
  a.querySelector('#shf').onpointerdown=function(e){var b=e.target.closest&&e.target.closest('.cup');if(!b||!ready||over)return;over=true;var s=+b.dataset.i;cups[fox].textContent='\u{1F98A}';
   if(s===fox){snd('fbok');done(1,'found the fox')}else{b.style.opacity='.4';snd('bad');done(0,'wrong bush')}};
 }},
 hp:{k:'hp',i:'\u{1F954}',name:'Hot Potato',d:'Pass it before it explodes',n:5,play:function(a,R,n,done,dif){
  var lo=[4,3,2.5][dif],hi=[13,12,10][dif],fuse=(lo+R()*(hi-lo))*1000,MAXT=12000,over=false,nt=0;
  a.innerHTML='<div class="pane" id="hpn"><div id="pot">\u{1F954}</div><div id="hv">+0 pts</div></div><button class="big" id="pass" style="margin-top:10px">Pass it!</button>';
  var pn=a.querySelector('#hpn'),pot=a.querySelector('#pot'),hv=a.querySelector('#hv'),bt=a.querySelector('#pass'),t0=performance.now();
  function val(t){return Math.round(100/N*Math.min(1,t/MAXT))}
  tm(setInterval(function(){var t=performance.now()-t0;
   if(t>=fuse){over=true;clr();pot.style.animation='';pot.textContent='\u{1F4A5}';hv.textContent='BOOM!';pn.style.background='#b13e53';bt.disabled=true;snd('hpboom');done(0,'it exploded');return}
   var h=Math.min(1,t/MAXT);hv.textContent='+'+val(t)+' pts';
   pn.style.background='hsl(0,'+Math.round(h*85)+'%,'+Math.round(8+h*18)+'%)';
   pot.style.animation='sh '+(.5-h*.4).toFixed(2)+'s infinite';
   if(t>=nt){snd('hptick',h);nt=t+700-h*520}},50));
  bt.onpointerdown=function(){if(over)return;over=true;clr();var t=performance.now()-t0;pot.style.animation='';pot.textContent='\u{1F60E}';bt.disabled=true;snd('hpbank');
   done(Math.min(1,t/MAXT),'passed at '+(t/1000).toFixed(1)+'s · fuse was '+(fuse/1000).toFixed(1)+'s')};
 }}
};
function picker(){return '<button class="g t" data-k="T"><div class="ic">\u{1F3C6}</div><b>Tournament</b><span>All games, one running total</span></button>'+Object.keys(GAMES).map(function(k){return '<button class="g" data-k="'+k+'"><div class="ic">'+GAMES[k].i+'</div><b>'+GAMES[k].name+'</b><span>'+GAMES[k].d+'</span></button>'}).join('')}
function players(){return room?room.peers().filter(function(p){return p.presence&&p.presence.name}).sort(function(a,b){return (a.presence.joinedAt-b.presence.joinedAt)||(a.peer<b.peer?-1:1)}):[]}
function isHost(){var p=players();return p.length>0&&p[0].sameTab}
function boardHTML(){return players().sort(function(a,b){return (b.presence.total||0)-(a.presence.total||0)}).map(function(p){var q=p.presence;
 return '<span class="chip'+(p.sameTab?' me':'')+'">'+esc(q.name)+' '+(q.total||0)+' · '+(q.done?'done':(q.r||0)+'/'+N)+'</span>'}).join('')}
function plist(host){return players().map(function(p){return '<div class="row'+(p.sameTab?' me':'')+'"><span>'+esc(p.presence.name)+(p.sameTab?' (you)':'')+'</span>'+(host&&!p.sameTab?'<span><button class="alt" data-a="pass" data-id="'+p.peer+'">Make host</button><button class="alt" data-a="kick" data-id="'+p.peer+'">Kick</button></span>':'')+'</div>'}).join('')}
function dsel(){return '<h2>Difficulty</h2><div class="seg">'+DFL.map(function(n,i){return '<button class="alt'+(S.dif===i?' on':'')+'" data-a="dif" data-v="'+i+'">'+n+'</button>'}).join('')+'</div>'}
function hp(){return '<div class="hp"><button class="alt" data-a="lock">Room: '+(S.lock?'locked':'open')+'</button><button class="alt" data-a="rs">Game length: '+RSL[S.rs]+'</button></div><div class="dsel">'+dsel()+'</div>'}
function stand(){
 var ps=mp?players():[{peer:'me',sameTab:true,presence:{name:nick||'You',gs:gs}}],n=0,pl={},PT=[10,7,5,3,2];
 ps.forEach(function(p){n=Math.max(n,(p.presence.gs||[]).length);pl[p.peer]=0});
 for(var i=0;i<n;i++){var lastS=null,rk=0;ps.slice().sort(function(a,b){return ((b.presence.gs||[])[i]||0)-((a.presence.gs||[])[i]||0)}).forEach(function(p,j){var s=(p.presence.gs||[])[i]||0;if(s!==lastS){rk=j;lastS=s}pl[p.peer]+=PT[Math.min(rk,4)]})}
 var sum=function(p){return (p.presence.gs||[]).reduce(function(x,y){return x+y},0)};
 return ps.sort(function(a,b){return sum(b)-sum(a)||pl[b.peer]-pl[a.peer]}).map(function(p,i){return '<div class="row'+(p.sameTab?' me':'')+'"><span>'+(i+1)+'. '+esc(p.presence.name)+'</span><span>'+sum(p)+' pts · '+pl[p.peer]+' place</span></div>'}).join('')}
function render(){if(!mp)return;var host=isHost();$('board').innerHTML=boardHTML();
 var s=$('stand');if(s)s.innerHTML=stand();var q;
 if(!mp.gid){$('plist').innerHTML=plist(host);$('pick').hidden=!host;$('hp').innerHTML=host?hp():'';$('hint').textContent=host?'Share the code. Pick a game when everyone is in.':'Waiting for the host to start…'}
 if(q=$('hp2'))q.innerHTML=host?hp():'';if(q=$('pl2'))q.innerHTML=plist(host);
 $('endb').hidden=!host}
function sync(){if(room)room.presence({r:round,total:total,done:round>=N}).catch(function(){})}
function begin(k,gid,keep){
 g=GAMES[k];round=0;total=0;tok++;fd=false;clr();N=Math.max(2,Math.round(g.n*RSF[S.rs]));if(!keep)gs=[];
 if(mp){var hh=players()[0];mp.end=(hh&&hh.presence.end)||0;mp.gid=gid;room.presence({gid:gid,game:k,r:0,total:0,done:false,gs:gs}).catch(function(){});document.body.className='mp'}else{document.body.className='';$('endb').hidden=false}
 $('lobby').hidden=true;$('fin').hidden=true;$('game').hidden=false;nextRound();render()}
function launch(){var gid=Date.now();
 if(mp)room.presence({tl:tl.join(','),ti:ti,rs:S.rs,dif:S.dif,lock:S.lock}).catch(function(){});
 begin(tl[ti],gid,ti>0)}
function startGame(k){if(mp&&!isHost())return;last=k;tl=k==='T'?Object.keys(GAMES):[k];ti=0;launch()}
function nextRound(){
 round++;var my=++tok;locked=false;clr();$('next').hidden=true;$('msg').textContent='';if(round===1)snd(g.k+'intro');$('gh').textContent=g.name+' · round '+round+' of '+N+' · '+DFL[S.dif];
 var seed=(mp?mp.code+mp.gid:String(Math.random()))+g.k+round;
 g.play($('area'),rng(seed),round,function(f,m){if(my===tok&&!locked){locked=true;done(f,m)}},S.dif)}
function done(frac,msg){
 var p=Math.round(100/N*Math.max(0,Math.min(1,frac)));total+=p;sync();render();
 $('msg').textContent='+'+p+' pts'+(msg?' · '+msg:'');
 var n=$('next');n.textContent=round>=N?'See results':'Next';n.hidden=false}
function finish(){
 if(fd||!g)return;fd=true;tok++;clr();$('game').hidden=true;document.body.className='';
 gs.push(total);if(mp)room.presence({gs:gs,total:total,done:true}).catch(function(){});
 var key='fw-best-'+g.k,best=0;try{best=+localStorage.getItem(key)||0}catch(e){}
 var nb=total>best;if(nb)try{localStorage.setItem(key,total)}catch(e){}
 var tour=tl.length>1,more=tour&&ti<tl.length-1,host=!mp||isHost();
 var h='<h2>'+g.name+(tour?' ('+(ti+1)+' of '+tl.length+')':'')+'</h2><div class="sc">'+total+' / 100</div><p class="s">'+(nb?'New best score!':'Your best: '+best)+'</p><h2>Standings</h2><div id="stand"></div>';
 if(host){h+=more?'<button data-a="next">Next game ('+(ti+2)+' of '+tl.length+')</button>':'<button data-a="again">Rematch</button><h2>Play something else</h2><div id="gl2">'+picker()+'</div>';
  if(mp)h+='<h2>Room</h2><div id="hp2"></div><div id="pl2"></div>';else h+='<div class="dsel">'+dsel()+'</div>'}
 else h+='<p class="s">Waiting for the host to continue…</p>';
 h+='<button class="alt" data-a="menu">Back to menu</button>';
 $('fin').innerHTML=h;$('fin').hidden=false;var q=$('gl2');if(q)q.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px';render()}
function peersChanged(){var h=players()[0];
 if(h&&!h.sameTab){var q=h.presence;S.rs=q.rs!=null?q.rs:1;S.dif=q.dif!=null?q.dif:1;S.lock=q.lock?1:0;
  if(q.gid&&q.gid!==mp.gid&&GAMES[q.game]){tl=(q.tl||q.game).split(',');ti=+q.ti||0;last=tl.length>1?'T':tl[0];begin(q.game,q.gid,ti>0)}
  else if(q.end&&q.end!==mp.end){mp.end=q.end;if(!$('game').hidden)finish()}}
 render()}
async function enter(code){
 nick=($('nm').value.trim()||'Player').slice(0,14);$('err').textContent='';
 try{room=await joinRoom(code);mp={code:code,gid:0,end:0};
  await room.presence({name:nick,joinedAt:Date.now(),gid:0,r:0,total:0,done:false,gs:[]});
  room.onPeers(peersChanged);
  room.onKick(function(){['lobby','game','fin'].forEach(function(i){$(i).hidden=true});$('board').innerHTML='';document.body.className='';$('kicked').hidden=false});
  setTimeout(function(){var h=players()[0];if(h&&!h.sameTab&&h.presence.lock){room.leave();['lobby','game','fin'].forEach(function(i){$(i).hidden=true});$('kicked').hidden=false;$('kicked').querySelector('p').textContent='That room is locked.'}},1000);
  $('hero').hidden=true;$('ctl').hidden=true;$('wait').hidden=false;$('shown').textContent=code;render();
 }catch(e){room=null;mp=null;$('err').textContent='Couldn\u2019t connect. Check your internet and try again.'}
}
function logo(){var m=['O..........O','OO........OO','OOOOOOOOOOOO','OOKOOOOOOKOO','OOOOOOOOOOOO','WOOOOOOOOOOW','WWOOOOOOOOWW','.WWWWWWWWWW.','.WWWWKKWWWW.','...WWWWWW...'],c={O:'#ef7d57',W:'#f4f4f4',K:'#1a1c2c'},r='';
 m.forEach(function(row,y){for(var x=0;x<12;x++){var ch=row[x];if(ch!=='.')r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+c[ch]+'"/>'}});
 $('logo').innerHTML='<svg viewBox="0 0 12 10" shape-rendering="crispEdges" role="img" aria-label="Pixel fox">'+r+'</svg>'}
logo();
function menu(){var h='<div class="in"><h2>Menu</h2><button data-a="mus">Music: '+(mus?'on':'off')+'</button><button data-a="sfx">Sound effects: '+(muted?'off':'on')+'</button><h2>Games</h2>';
 h+=Object.keys(GAMES).map(function(k){var b=0;try{b=+localStorage.getItem('fw-best-'+k)||0}catch(e){}return '<div class="mg"><div class="ic">'+GAMES[k].i+'</div><div><b>'+GAMES[k].name+'</b><span>'+GAMES[k].d+' · Best '+b+'</span></div></div>'}).join('');
 h+='<button class="alt" data-a="menu">Back to home</button><button data-a="close">Close</button></div>';$('menu').innerHTML=h}
$('gl').innerHTML=picker();
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-k],[data-a]');if(!b)return;snd('tap');
 if(b.dataset.k)return startGame(b.dataset.k);
 var a=b.dataset.a,id=b.dataset.id;
 if(a==='kick'){room.remove(id)}
 else if(a==='pass'){var m=Math.min.apply(null,players().map(function(p){return p.presence.joinedAt}));room.patch(id,{joinedAt:m-1})}
 else if(a==='lock'){S.lock=S.lock?0:1;room.presence({lock:S.lock});render()}
 else if(a==='rs'){S.rs=(S.rs+1)%3;room.presence({rs:S.rs});render()}
 else if(a==='dif'){S.dif=+b.dataset.v;if(room)room.presence({dif:S.dif}).catch(function(){});var ds=document.querySelectorAll('.dsel');for(var di=0;di<ds.length;di++)ds[di].innerHTML=dsel();render()}
 else if(a==='next'){ti++;launch()}
 else if(a==='again'){startGame(last)}
 else if(a==='end'){if(mp)room.presence({end:Date.now()});finish()}
 else if(a==='open'){menu();$('menu').hidden=false}
 else if(a==='close')$('menu').hidden=true
 else if(a==='mus'){mus=!mus;try{localStorage.setItem('fw-music',mus?'1':'0')}catch(x){}if(mus)mstart();else mstop();menu()}
 else if(a==='sfx'){muted=!muted;try{localStorage.setItem('fw-mute',muted?'1':'0')}catch(x){}menu()}
 else if(a==='menu')location.reload()});
$('next').onclick=function(){snd('tap');if(round>=N)finish();else nextRound()};
$('mk').onclick=function(){var a='ABCDEFGHJKMNPQRSTUVWXYZ',c='';for(var i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];enter(c)};
$('jn').onclick=function(){var c=$('cd').value.trim().toUpperCase();if(!/^[A-Z]{4}$/.test(c)){$('err').textContent='Enter the 4-letter code.';return}enter(c)};
$('solo').onclick=function(){mp=null;nick=($('nm').value.trim()||'You').slice(0,14);$('hero').hidden=true;$('ctl').hidden=true;$('sdif').innerHTML=dsel();$('sdif').hidden=false;$('pick').hidden=false};
</script>
